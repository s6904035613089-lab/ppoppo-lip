<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Strawberry Milk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ppoppo P02 Strawberry Milk</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0F4"/><stop offset="100%" stop-color="#FFD3DE"/>
    </linearGradient>
    <linearGradient id="lipGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e93c5e"/>
      <stop offset="42%"  stop-color="#F2879C"/>
      <stop offset="62%"  stop-color="#fad1d9"/>
      <stop offset="100%" stop-color="#ec5774"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="1" y2="0">
