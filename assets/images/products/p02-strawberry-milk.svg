      <stop offset="50%"  stop-color="#f7f3ef"/>
      <stop offset="78%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfc8c2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
