<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ | ppoppo POS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/images/logo-mark.svg">
<link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <a href="index.html"><img src="assets/images/logo.svg" alt="ppoppo" style="height:64px"></a>
      <h4 class="mt-3 mb-1">เข้าสู่ระบบพนักงาน</h4>
      <p class="small text-muted-pp mb-0">สำหรับหน้าขาย POS และหลังบ้าน</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">อีเมล</label>
        <input class="form-control" name="email" type="email" autocomplete="username" required placeholder="you@ppoppo.com">
      </div>
      <div class="mb-3">
        <label class="form-label">รหัสผ่าน</label>
        <div class="position-relative">
          <input class="form-control pe-5" name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
          <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-1"
                  onclick="togglePw(this)" tabindex="-1">👁️</button>
        </div>
      </div>
      <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>
      <button class="btn btn-pp w-100" type="submit">เข้าสู่ระบบ</button>
    </form>

    <div class="bg-cream-2 rounded-4 p-3 mt-4 small">
      <div class="fw-semibold mb-1">🔑 บัญชีพนักงาน</div>
      <div class="text-muted-pp">
        สร้างได้ที่ Supabase Dashboard → <b>Authentication → Users → Add user</b><br>
        บัญชีแรกที่สร้างจะเป็น <b>admin</b> อัตโนมัติ บัญชีถัดไปเป็นแคชเชียร์ (แอดมินเปลี่ยนสิทธิ์ได้ในหลังบ้าน)
      </div>
    </div>

    <div class="text-center mt-3">
      <a href="index.html" class="small text-muted-pp">← กลับหน้าเว็บไซต์</a>
    </div>
  </div>
</div>

<script src="assets/vendor/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script>
function togglePw(btn) {
  const i = btn.previousElementSibling;
  i.type = i.type === 'password' ? 'text' : 'password';
}

const NEXT = new URLSearchParams(location.search).get('next');
function goNext(s) {
  const page = NEXT === 'admin' ? 'admin.html' : NEXT === 'pos' ? 'pos.html' : (s.role === 'admin' ? 'admin.html' : 'pos.html');
  location.href = page;
}

(async () => {
  await API.init();
  const s = API.session();
  if (s) goNext(s);
})();

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const err = document.getElementById('loginError');
  const btn = f.querySelector('button[type=submit]');
  err.classList.add('d-none');
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ…';
  try {
    await API.init();
    const s = await API.login(f.email.value, f.password.value);
    goNext(s);
  } catch (ex) {
    err.textContent = /invalid login/i.test(ex.message) ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : ex.message;
    err.classList.remove('d-none');
    btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  }
});
</script>
</body>
</html>
