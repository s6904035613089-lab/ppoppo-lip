      <stop offset="30%"  stop-color="#f6dfae"/>
      <stop offset="55%"  stop-color="#e3b871"/>
      <stop offset="100%" stop-color="#b8853c"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
